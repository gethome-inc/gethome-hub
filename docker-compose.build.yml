# Build the hub from this checkout instead of pulling the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Two reasons to want this: you changed the source, or you're on an
# architecture `publish.yml` doesn't build (it covers amd64, arm64 and armhf).
# `deploy/install.sh` falls back to it on its own when the pull fails, so a
# machine nobody anticipated still ends up with a working hub — it just takes
# twenty minutes rather than two.
#
# `pull_policy: build` is what stops Compose reaching for the registry copy
# when a local image happens to be lying around under the same name.

services:
  hubd:
    build: .
    image: ${GETHOME_IMAGE:-ghcr.io/gethome-inc/gethome-hub:latest}
    pull_policy: build
