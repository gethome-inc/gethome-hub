name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gethome
          POSTGRES_PASSWORD: gethome
          POSTGRES_DB: gethome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gethome"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      # Mosquitto needs our config file, so it starts after checkout
      # (service containers can't mount workspace paths).
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          HUB_TEST_MQTT: "1"
      - run: npm run build
