name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job carries a timeout, because the default is GitHub's six-hour job
# limit and that is not a timeout — it is a whole working day of a pull request
# sitting yellow. One `apt-get` on the shell job hung and burned exactly that
# (run 103), and the check it was installing never ran. These numbers are a few
# times the honest duration of each job: a run that reaches one has hung.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No database service any more: the hub's store is a SQLite file, so
      # every suite that used to skip itself when Postgres wasn't running now
      # always runs. Mosquitto is still real, because the round-trip suites
      # are the proof the pipeline works end to end.
      - name: Start Mosquitto
        run: |
          set -euo pipefail
          # A mirror that accepts the connection and then says nothing will
          # otherwise hold this step open until the job limit kills it — apt
          # has no timeout of its own. Retries cover the ordinary flake.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          # The runner image ships apt repositories this project never installs
          # from — Google Chrome, Microsoft — and `apt-get update` refreshes
          # every one of them. A hash mismatch on any single list is a *fatal*
          # update, not a skipped one: on 2026-09-09 dl.google.com served a
          # `Packages.gz` whose checksum did not match the `Release` file
          # beside it, apt exited 100, and a job that wanted nothing but
          # mosquitto died in twelve seconds without reaching `npm ci`. The
          # retries above do not help, because nothing failed to arrive — the
          # file that arrived was the wrong one. So the third-party lists are
          # moved aside and only Ubuntu's own archive is refreshed. Ubuntu's
          # own entry survives under both layouts the images use: plain
          # `sources.list` on 22.04, which is not in this directory at all,
          # and `sources.list.d/ubuntu.sources` on 24.04 and later, which is
          # named here so it stays. Nothing is deleted — a step that quietly
          # broke the archive it needs would be worse than the flake it fixes,
          # and `apt-get install` below is what proves it did not.
          sudo mkdir -p /etc/apt/sources.list.d.off
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*.list' -o -name '*.sources' \) ! -name 'ubuntu.sources' \
            -exec mv -t /etc/apt/sources.list.d.off {} +
          sudo apt-get update -qq "${apt_opts[@]}"
          sudo apt-get install -y -qq "${apt_opts[@]}" mosquitto
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/ci.conf >/dev/null
          sudo systemctl restart mosquitto
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two passes: the build's own `src`-only one, then `tsconfig.test.json`
      # over `test/` as well. The second exists because this job used to be
      # the *only* thing that ever saw a type error in a suite — and it saw
      # it as a 500 from a running server rather than as a compile error.
      - run: npm run typecheck
      - run: npm test
        env:
          HUB_TEST_MQTT: "1"
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No `npm ci`: audit resolves the tree from package-lock.json alone, so
      # this job is a checkout and one registry call rather than a full install.
      #
      # `--omit=dev` scopes it to what actually reaches a user's hub. The bundle
      # `bundle.yml` publishes is `dist/` plus *production* `node_modules`, so a
      # vitest or tsx advisory is a CI-machine problem, not a Pi problem — and
      # gating on it would block unrelated pull requests on something that never
      # ships. Dependabot still opens PRs for those; this only refuses to merge
      # a vulnerable dependency into the hub itself.
      #
      # `moderate` rather than `high` because the four alerts that prompted this
      # job included a moderate one, and both packages were production deps
      # reached transitively (mqtt → socks → ip-address, and the since-removed
      # claude-agent-sdk → mcp-sdk → hono) — nothing a glance at package.json
      # would have shown.
      #
      # If this ever fails on an advisory with no fix published, don't drop the
      # gate: npm has no per-advisory ignore list, so pin the fix in `overrides`
      # the way esbuild is pinned there, and say why. When there is no fix to
      # pin and the vulnerable package is one nothing on a hub ever runs, take
      # it out of the tree instead, the way `patch-package` is stubbed (the
      # root CLAUDE.md says how, and why that one is safe).
      - run: npm audit --omit=dev --audit-level=moderate

  plugin-version:
    name: Plugin version
    # Only a pull request has a base to compare with.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Claude Code and Codex cache an installed plugin by its version, so a
      # change to the agent skills that keeps the number reaches nobody who
      # already has them: their update answers "already at the latest
      # version". `test/skills.test.ts` holds the two manifests to one number;
      # this holds the number to the change. `plugins/CLAUDE.md` has the rest.
      - name: A change to plugins/gethome raises its version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" HEAD)"
          if git diff --quiet "$base" HEAD -- plugins/gethome; then
            echo "plugins/gethome is unchanged."
            exit 0
          fi
          manifest=plugins/gethome/.claude-plugin/plugin.json
          after="$(jq -r .version "$manifest")"
          if ! before="$(git show "$base:$manifest" 2>/dev/null | jq -r .version)"; then
            echo "The plugin is new, at $after."
            exit 0
          fi
          if [[ "$before" == "$after" ]]; then
            echo "::error file=$manifest::plugins/gethome changed, but its version is still $after. Raise it here and in plugins/gethome/plugin.json, or nobody who has the plugin will get the change."
            exit 1
          fi
          highest="$(printf '%s\n%s\n' "$before" "$after" | sort -V | tail -n 1)"
          if [[ "$highest" != "$after" ]]; then
            echo "::error file=$manifest::the version went from $before to $after; it has to grow."
            exit 1
          fi
          echo "plugins/gethome changed, and its version moved from $before to $after."

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `deploy/` is a contract with GetHome Studio, and it is the part of this
      # repository with no type checker behind it.
      #
      # ShellCheck ships on the runner image, so this normally installs nothing
      # and the apt path is the fallback for an image that ever drops it. It was
      # an unconditional `apt-get update && apt-get install`, and one of those
      # calls hung until GitHub's six-hour job limit killed the job — a red
      # cross on a pull request whose scripts were never actually checked.
      - name: Ensure shellcheck
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          echo "shellcheck is not on this image; installing it"
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          # The third-party lists again — see the note on the mosquitto step.
          sudo mkdir -p /etc/apt/sources.list.d.off
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*.list' -o -name '*.sources' \) ! -name 'ubuntu.sources' \
            -exec mv -t /etc/apt/sources.list.d.off {} +
          sudo apt-get update -qq "${apt_opts[@]}"
          sudo apt-get install -y -qq "${apt_opts[@]}" shellcheck
      - run: shellcheck -S warning deploy/install.sh deploy/zigbee-detect.sh deploy/update-runner.sh deploy/gethome-hubctl deploy/wifi-credentials.sh deploy/wifi-profile.sh deploy/wifi-networks.sh deploy/matter-ipv6.sh deploy/wifi-watchdog.sh
