name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No database service any more: the hub's store is a SQLite file, so
      # every suite that used to skip itself when Postgres wasn't running now
      # always runs. Mosquitto is still real, because the round-trip suites
      # are the proof the pipeline works end to end.
      - name: Start Mosquitto
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/ci.conf >/dev/null
          sudo systemctl restart mosquitto
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          HUB_TEST_MQTT: "1"
      - run: npm run build

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `deploy/` is a contract with GetHome Studio, and it is the part of this
      # repository with no type checker behind it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning deploy/install.sh deploy/zigbee-detect.sh deploy/gethome-hubctl deploy/hubctl deploy/install-macos.sh
