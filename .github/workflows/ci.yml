name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No database service any more: the hub's store is a SQLite file, so
      # every suite that used to skip itself when Postgres wasn't running now
      # always runs. Mosquitto is still real, because the round-trip suites
      # are the proof the pipeline works end to end.
      - name: Start Mosquitto
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/ci.conf >/dev/null
          sudo systemctl restart mosquitto
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          HUB_TEST_MQTT: "1"
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No `npm ci`: audit resolves the tree from package-lock.json alone, so
      # this job is a checkout and one registry call rather than a full install.
      #
      # `--omit=dev` scopes it to what actually reaches a user's hub. The bundle
      # `bundle.yml` publishes is `dist/` plus *production* `node_modules`, so a
      # vitest or tsx advisory is a CI-machine problem, not a Pi problem — and
      # gating on it would block unrelated pull requests on something that never
      # ships. Dependabot still opens PRs for those; this only refuses to merge
      # a vulnerable dependency into the hub itself.
      #
      # `moderate` rather than `high` because the four alerts that prompted this
      # job included a moderate one, and both packages were production deps
      # reached transitively (mqtt → socks → ip-address, and the since-removed
      # claude-agent-sdk → mcp-sdk → hono) — nothing a glance at package.json
      # would have shown.
      #
      # If this ever fails on an advisory with no fix published, don't drop the
      # gate: npm has no per-advisory ignore list, so pin the fix in `overrides`
      # the way esbuild is pinned there, and say why.
      - run: npm audit --omit=dev --audit-level=moderate

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `deploy/` is a contract with GetHome Studio, and it is the part of this
      # repository with no type checker behind it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning deploy/install.sh deploy/zigbee-detect.sh deploy/gethome-hubctl
