# Publishes the hub as a per-architecture tarball, so a Raspberry Pi downloads
# it instead of building it.
#
# Building on the Pi meant `npm ci` fetching a thousand-odd packages and then
# `tsc` compiling them, on an SD card, for twenty to forty minutes — with every
# minute of it another chance for a flaky connection to reset and throw the
# whole thing away, and, on a 512 MB board, an OOM kill at the end of it
# regardless. Here it happens once, on machines built for it.
#
# A tarball rather than a container image: the hub runs as a systemd unit now,
# not in Docker, and a Pi Zero cannot spare the ~130 MB the Docker daemon costs.
#
# Each bundle carries `node_modules` **built for its own architecture**, which
# is the part that matters: better-sqlite3 ships prebuilt binaries inside its
# npm tarball for linux-arm64 and linux-x64 — and those are the only two
# architectures the hub supports. 32-bit ARM is deliberately not built: it has
# no prebuilt SQLite binding, it needs a slow QEMU cross-build here, and every
# board the hub runs on (Zero 2 W, 3, 4, 5) is 64-bit. `install.sh` refuses a
# 32-bit system by name and says how to reinstall.
#
# Every bundle carries a VERSION stamp, which becomes the release directory
# name on the Pi and the build id the API reports — so "which build is this
# hub running" has one answer from CI all the way to the app.
#
# ── Two repositories share this file ───────────────────────────────────────
# Development happens in a private repository and only `main` is mirrored into
# the public one (`mirror.yml`, `docs/release.md`). This file runs in both, and
# the branch list above is half of what keeps the split honest: it used to be
# `["**"]`, which published a prerelease *named after the branch* on every push
# — so a feature branch pushed to the public repository would announce itself,
# tag and all, before anything was released. `main` and `v*` are the release
# paths; `hw/**` is the deliberate escape hatch for a branch you want on real
# hardware and don't mind being visible.
#
# The other half is the job guard below: in the private repository only `hw/**`
# and a manual dispatch build, because a private `main` or `v*` build would be a
# duplicate of the public release the mirror is about to trigger — paid for in
# private Actions minutes, arm64 runner included. Dev bundles land in the
# private repository's own releases, where `install.sh --repo … --token …`
# fetches them.

name: Publish bundle

on:
  push:
    branches: [main, "hw/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle ${{ matrix.arch }}
    # In the public repository every trigger above publishes. In the private one
    # only the opt-in hardware-test branches and a manual dispatch do — see the
    # note at the top. `release` needs this job, so skipping it skips the upload.
    if: >-
      github.repository == 'gethome-inc/gethome-hub'
      || startsWith(github.ref, 'refs/heads/hw/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      # The build id: version, short SHA, and the branch it came from. It names
      # the release directory on the Pi, so `gethome-hubctl version` and the
      # API report something a human can trace back to a commit.
      - name: Stamp the build
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          ref=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c '[:alnum:]._-' '-')
          printf '%s-%s-%s\n' "$version" "${GITHUB_SHA::7}" "$ref" > VERSION
          cat VERSION

      # One container per architecture, so `npm ci` resolves the same optional
      # and platform-specific packages the Pi would — and compiles any native
      # module against the right ABI. `node:22-bookworm` matches what
      # install.sh puts on the machine: Node 22, glibc, Debian.
      - name: Build the bundle
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            node:22-bookworm bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends python3 make g++ >/dev/null
              npm ci --no-audit --no-fund
              npm run build
              npm ci --omit=dev --no-audit --no-fund
              mkdir -p /src/out
              tar -czf "/src/out/gethome-hub-${{ matrix.arch }}.tar.gz" \
                dist node_modules package.json deploy VERSION
            '

      - name: Check the bundle actually runs
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && tar -xzf "out/gethome-hub-${{ matrix.arch }}.tar.gz" -C /tmp/verify
          # Boots, migrates a fresh SQLite file, answers, and shuts down. This
          # is the check that would have caught a bundle missing its native
          # SQLite binding — the failure mode a cross-built tarball has and a
          # container image does not.
          DATA_DIR=/tmp/verify-data MDNS=0 ADAPTER_ZIGBEE=0 ADAPTER_MQTT=0 ADAPTER_MATTER=0 \
            node /tmp/verify/dist/index.js &
          hub=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8420/api/v1/hub && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8420/api/v1/hub | tee /dev/stderr | grep -q '"apiVersion":1'
          kill "$hub"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [bundle]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: bundle-*
          merge-multiple: true

      # A rolling release per branch, which is what makes testing a branch on
      # real hardware possible: install.sh derives the tag from `--branch`, so
      # a card written from a feature branch installs that branch's build. The
      # tag has slashes flattened because a release tag is a git ref.
      #
      # Which branches reach here is decided by the triggers and the guard
      # above, not here: `main` and `hw/**` publicly, `hw/**` and dispatches
      # privately. This step publishes to whichever repository it is running in,
      # so a private build's assets are private without any special casing.
      #
      # These are disposable — `bundle-cleanup.yml` deletes each one when its
      # branch goes away, so they don't pile up. A `v*` tag takes the other
      # branch below and publishes an immutable release, which nothing deletes.
      #
      # **A rolling release has to actually roll, including the parts nobody
      # downloads.** This used to create the release only when it was missing
      # and then upload assets with `--clobber` — so the notes and the tag kept
      # naming whatever commit the branch first built, forever, while the
      # tarballs beside them moved. Checked on a live repo: `bundle-main`'s
      # notes and tag both said `47b48bf` while its assets were two days newer
      # and `main` was at `a86c1dc`.
      #
      # Nothing *resolves* a bundle through the tag's commit — `install.sh`
      # fetches `releases/download/<tag>/<asset>`, which goes through the
      # release, and `bundle-cleanup.yml` matches tag names — so this was never
      # a broken download. It was worse in a quieter way: the release page is
      # where a human goes to ask which build is on their Pi, and it was
      # answering with a commit that wasn't in it.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
            flags=""
            rolling=""
          else
            tag="bundle-$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')"
            title="Build of ${GITHUB_REF_NAME}"
            flags="--prerelease"
            rolling=1
          fi
          notes="Automatic build of \`${GITHUB_REF_NAME}\` (${GITHUB_SHA})."

          existed=1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            existed=""
            gh release create "$tag" --title "$title" --notes "$notes" $flags
          fi

          # The tarballs go up before anything is re-pointed. They are the
          # load-bearing artifact — a Pi installing this branch downloads them
          # and nothing else — so if the re-pointing below fails, the failure
          # should cost a red job and a stale description, never a branch with
          # no bundle at all. `set -e` means it fails loudly either way.
          gh release upload "$tag" out/*.tar.gz --clobber

          # Then make the release describe what was just uploaded. Only for a
          # rolling branch release, and only when it already existed — a `v*`
          # release is immutable, and re-pointing a version tag would rewrite
          # history somebody may already have installed.
          if [[ -n "$rolling" && -n "$existed" ]]; then
            git push --force origin "${GITHUB_SHA}:refs/tags/${tag}"
            gh release edit "$tag" --title "$title" --notes "$notes"
          fi
