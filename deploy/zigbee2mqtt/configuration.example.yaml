# Example Zigbee2MQTT configuration for a GetHome Hub.
#
# You do not normally write this file. `deploy/install.sh` installs Zigbee2MQTT
# from npm and lets it create its own configuration.yaml in
# /var/lib/gethome/zigbee2mqtt on first run; the coordinator's device path
# arrives as a `ZIGBEE2MQTT_CONFIG_SERIAL_PORT` override from
# `deploy/zigbee-detect.sh`.
#
# That separation is deliberate: the file Zigbee2MQTT owns also holds the Zigbee
# network key and the list of paired devices. Anything that rewrote it whenever
# a stick was replugged would lose the user's whole network.
#
# This copy documents the same settings for a manual installation.

mqtt:
  server: mqtt://127.0.0.1:1883
  base_topic: zigbee2mqtt

serial:
  # Your Zigbee USB adapter. Common paths: /dev/ttyACM0, /dev/ttyUSB0,
  # /dev/serial/by-id/usb-... (the by-id path survives reboots).
  port: /dev/ttyACM0

frontend:
  enabled: false

advanced:
  # The hub reads device definitions from zigbee2mqtt/bridge/devices and
  # state from per-device topics; no Home Assistant discovery needed.
  legacy_api: false
  legacy_availability_payload: false

availability:
  enabled: true
