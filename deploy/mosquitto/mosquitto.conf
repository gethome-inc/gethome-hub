# Mosquitto configuration for GetHome Hub.
# The broker is LAN-internal plumbing between hubd, Zigbee2MQTT, and local
# MQTT integrations. It binds to all interfaces so devices elsewhere on the
# LAN (DIY boards, wired controllers) can publish; do not expose port 1883
# beyond your network.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
